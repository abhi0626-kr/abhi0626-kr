<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50" viewBox="0 0 600 50" role="img" aria-labelledby="title description">
  <title id="title">Animated introduction</title>
  <desc id="description">Always Learning. Building Cool Projects. Open Source Enthusiast.</desc>

  <defs>
    <clipPath id="clip-one">
      <rect x="0" y="5" width="0" height="40">
        <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.09;0.76;0.84" dur="12s" begin="0s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-two">
      <rect x="0" y="5" width="0" height="40">
        <animate attributeName="width" values="0;500;500;0" keyTimes="0;0.09;0.76;0.84" dur="12s" begin="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-three">
      <rect x="0" y="5" width="0" height="40">
        <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.09;0.76;0.84" dur="12s" begin="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <g font-family="Courier New, monospace" font-size="34" font-weight="700" text-anchor="middle" fill="#00F5FF">
    <text x="300" y="38" clip-path="url(#clip-one)">
      Always Learning
      <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.82;0.84;1" dur="12s" begin="0s" repeatCount="indefinite" />
    </text>
    <text x="300" y="38" clip-path="url(#clip-two)">
      Building Cool Projects
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.76;0.84" dur="12s" begin="4s" repeatCount="indefinite" />
    </text>
    <text x="300" y="38" clip-path="url(#clip-three)">
      Open Source Enthusiast
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.76;0.84" dur="12s" begin="8s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
